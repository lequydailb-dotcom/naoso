[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naota-cli"
version = "1.0.0"
description = "Naota CLI - nói chuyện với NAOTA từ terminal"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "NAOTA" }]
keywords = ["naota", "cli", "ai", "agent", "second-brain"]

# CHỈ httpx. Đây là một luật, không phải sự tình cờ: gói này phải cài được trên máy chưa từng
# có Naota, và mọi thứ kéo thêm (fastapi, uvicorn, rich...) đều là thứ người dùng phải tải về
# chỉ để gõ một câu hỏi. Có test canh đúng danh sách này.
dependencies = ["httpx>=0.24"]

[project.urls]
Homepage = "https://github.com/vuongtex/naota"
Documentation = "https://github.com/vuongtex/naota#readme"

[project.scripts]
naota = "naota_cli.__main__:main"

[tool.setuptools.packages.find]
include = ["naota_cli*"]
