name: Điều khiển app trên máy
name_en: "Control apps on this computer"
slug: desktop-apps
version: 1.0.0
description: Mở, đóng và liệt kê ứng dụng trên CHÍNH MÁY đang chạy Naota (Windows, macOS, Linux có màn hình) theo lời người dùng, ví dụ "mở Chrome", "tắt Excel", "đang mở app nào". Tự chặn và nói rõ khi Naota chạy trong Docker trên máy chủ, vì khi đó máy chạy Naota không phải máy của người dùng.
description_en: "Opens, closes and lists apps on THE MACHINE running Naota (Windows, macOS, Linux with a screen) when you ask, e.g. \"open Chrome\", \"close Excel\", \"which apps are open\". Blocks itself and says so when Naota runs in Docker on a server, because then the machine running Naota is not yours."
author: Naota (bundled)
enabled: true
min_mode: safe
tools:
  - naota_app_list
  - naota_app_open
  - naota_app_close
hooks: []
